<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · JUNTAUCR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Instrument+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/login.js"></script>
  </head>
  <body>
    <main class="login-wrap">
      <section class="card login-card" aria-labelledby="login-title">
        <div class="login-brand">
          <span class="brand-mark brand-mark-lg">
            <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#logo"></use></svg>
          </span>
          <div class="brand-name">JUNTAUCR</div>
          <div class="brand-sub">SINPE Móvil · prototipo</div>
        </div>

        <h1 id="login-title" class="login-title">Iniciar sesión</h1>
        <p class="page-sub">Ingrese con su usuario y contraseña.</p>

        <form id="login-form" class="login-form">
          <div id="login-alert" class="alert alert-bad" role="alert" hidden></div>
          <div class="field">
            <label class="label" for="entityId">Entidad financiera</label>
            <select class="select" id="entityId" name="entityId" required></select>
          </div>
          <div class="field">
            <label class="label" for="username">Usuario</label>
            <input
              class="input"
              id="username"
              name="username"
              autocomplete="username"
              maxlength="50"
              required
            />
          </div>
          <div class="field">
            <label class="label" for="password">Contraseña</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="128"
              required
            />
          </div>
          <label class="check">
            <input type="checkbox" id="show-password" />
            Mostrar contraseña
          </label>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>

        <p class="login-hint">
          <span>Administrador: admin · Juntaucr2026</span>
          <span>Cliente: leonardo.aguilar · Cliente2026</span>
        </p>
      </section>
    </main>
  </body>
</html>
